
<button class="btn btn-primary" (click)="generatePDF()">Imprimir todos</button>
<br><br><br>

<div class="container-fluid">
  <div class="row">
    <div class="col-4">
      <label>Buscar por número de resolución o RIVM</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="busqueda"
        placeholder="Número de resolución o RIVM"
      />
      <br />
      <button class="btn btn-primary" (click)="buscar()">Buscar</button>
    </div>
    <div class="row">
      <div class="col-10">
        <br />
        <table class="table" *ngIf="resultados.length > 0">
          <thead class="thead-dark">
            <tr>
              <th>#</th>
              <th>Número de Resolución</th>
              <th>RIVM</th>
              <th>solicitante</th>
              <th>acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of resultados; let i = index">
              <th scope="row">{{i + 1}}</th>
              <td>{{r.numero_resolucion}}</td>
              <td>{{r.rivm}}</td>
              <td>{{r.solicitante}}</td>
              <th><button class="btn btn-danger" (click)="generatePDF(r)">Imprimir</button></th>
            </tr>
          </tbody>
        </table>

        <div *ngIf="resultados.length === 0 && busqueda.length > 0">
          <p>No se encontraron resultados.</p>
        </div>
      </div>
    </div>
  </div>
</div>
